<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="11%" y1="9%" x2="89%" y2="91%">
      <stop offset="0%" stop-color="#031222" />
      <stop offset="52%" stop-color="#082D4F" />
      <stop offset="100%" stop-color="#05476E" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#17A2E8" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#0B5E8A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#031222" stop-opacity="0.0" />
    </radialGradient>
    <clipPath id="squircleClip">
      <rect x="4" y="4" width="100" height="100" rx="23" ry="23" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Base Gradient -->
    <rect x="0" y="0" width="108" height="108" fill="url(#bgGrad)" />
    <circle cx="54" cy="54" r="46" fill="url(#coreGlow)" />

    <!-- Frutiger Aero Top Specular Glass Canopy -->
    <path d="M0,0 H108 V44 C84,54 24,54 0,44 Z" fill="#B8E9FF" fill-opacity="0.18" />

    <!-- Radar Range Rings & Crosshairs -->
    <circle cx="54" cy="54" r="39" fill="none" stroke="#49D3FF" stroke-opacity="0.28" stroke-width="1.2" />
    <circle cx="54" cy="54" r="28" fill="none" stroke="#19E68C" stroke-opacity="0.24" stroke-width="1.0" />
    <line x1="54" y1="10" x2="54" y2="98" stroke="#7CE0FF" stroke-opacity="0.15" stroke-width="0.9" />
    <line x1="10" y1="54" x2="98" y2="54" stroke="#7CE0FF" stroke-opacity="0.15" stroke-width="0.9" />

    <!-- Outer Octagonal Tactical Shield -->
    <polygon points="40.5,18 67.5,18 90,40.5 90,67.5 67.5,90 40.5,90 18,67.5 18,40.5"
             fill="#04182B" fill-opacity="0.36"
             stroke="#38CFFF" stroke-width="3.0" stroke-linejoin="round" />

    <!-- Warm Tactical Amber RF Signal Arcs -->
    <path d="M35,26 C46,19.5 62,19.5 73,26" fill="none" stroke="#FFB02E" stroke-width="3.2" stroke-linecap="round" />
    <path d="M35,82 C46,88.5 62,88.5 73,82" fill="none" stroke="#FFB02E" stroke-width="3.2" stroke-linecap="round" />

    <!-- Inner Diamond Mesh Constellation Lattice -->
    <polygon points="54,25 83,54 54,83 25,54"
             fill="none" stroke="#5EE2FF" stroke-opacity="0.75" stroke-width="2.0" stroke-linejoin="round" />
    <line x1="33" y1="33" x2="75" y2="75" stroke="#19E68C" stroke-opacity="0.46" stroke-width="1.6" stroke-linecap="round" />
    <line x1="75" y1="33" x2="33" y2="75" stroke="#19E68C" stroke-opacity="0.46" stroke-width="1.6" stroke-linecap="round" />

    <!-- Bold Emerald Outer Glow Halo for Pulse Waveform -->
    <polyline points="20,54 35,54 42.5,32 50.5,76 58.5,28 65.5,64 71.5,54 88,54"
              fill="none" stroke="#19E68C" stroke-opacity="0.45" stroke-width="8.2"
              stroke-linecap="round" stroke-linejoin="round" />

    <!-- High-Amplitude Emerald + Ice-White Core Pulse Waveform -->
    <polyline points="20,54 35,54 42.5,32 50.5,76 58.5,28 65.5,64 71.5,54 88,54"
              fill="none" stroke="#19E68C" stroke-width="4.6"
              stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="22,54 35,54 42.5,32 50.5,76 58.5,28 65.5,64 71.5,54 86,54"
              fill="none" stroke="#F0F9FF" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4 Diagonal Satellite Mesh Nodes -->
    <circle cx="33" cy="33" r="4.5" fill="#FFB02E" stroke="#FFFFFF" stroke-width="1.3" />
    <circle cx="75" cy="33" r="4.5" fill="#38CFFF" stroke="#FFFFFF" stroke-width="1.3" />
    <circle cx="33" cy="75" r="4.5" fill="#38CFFF" stroke="#FFFFFF" stroke-width="1.3" />
    <circle cx="75" cy="75" r="4.5" fill="#FFB02E" stroke="#FFFFFF" stroke-width="1.3" />

    <!-- 2 Cardinal Relay Beacons -->
    <circle cx="54" cy="21" r="3.8" fill="#19E68C" stroke="#04182B" stroke-width="1.3" />
    <circle cx="54" cy="87" r="3.8" fill="#19E68C" stroke="#04182B" stroke-width="1.3" />

    <!-- Outer Squircle Crystal Rim -->
    <rect x="4.8" y="4.8" width="98.4" height="98.4" rx="22.2" ry="22.2"
          fill="none" stroke="#7AE0FF" stroke-opacity="0.55" stroke-width="1.6" />
  </g>
</svg>
